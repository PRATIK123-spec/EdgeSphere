# Render Blueprint for the EdgeSphere FastAPI backend (frontend not deployed here).
# No secret values live in this file: DATABASE_URL comes from the linked
# Render PostgreSQL instance and SECRET_KEY is generated by Render.

services:
  - type: web
    name: edgesphere-api
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    # Free plan has no preDeployCommand, so migrations run before the server
    # starts. If they fail, the new deploy never goes live. Single process:
    # the WebSocket hub is in-memory, so do not add --workers.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: edgesphere-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: DEBUG
        value: "false"
      - key: SQL_ECHO
        value: "false"
      - key: DEVICE_MONITOR_ENABLED
        value: "true"
      # Set to the frontend origin(s) once the frontend is deployed.
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: edgesphere-db
    plan: free
    region: oregon
    databaseName: edgesphere
    user: edgesphere
